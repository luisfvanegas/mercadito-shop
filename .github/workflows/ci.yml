name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: shop-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_PREFIX: ghcr.io/luisfvanegas/mercadito-shop

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: shop
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d shop"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/shop?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
          cache: true
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a
        with:
          version: latest
          args: ./...
      - run: make vet
      - run: make test
      - run: make integration
      - run: make images
      - run: make size
      - run: make docs-check

  image:
    runs-on: ubuntu-latest
    needs: verify
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        service: [storefront, catalog, cart, checkout, payments-mock]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          build-args: SERVICE=${{ matrix.service }}
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:sha-${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:sha-${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        with:
          image-ref: ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:sha-${{ github.sha }}
          format: spdx-json
          output-file: sbom-${{ matrix.service }}.spdx.json
          upload-artifact: false
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac
      - name: Sign image
        env:
          COSIGN_EXPERIMENTAL: "true"
        run: cosign sign --yes "${IMAGE_PREFIX}/${{ matrix.service }}@${{ steps.build.outputs.digest }}"

  deploy:
    runs-on: ubuntu-latest
    needs: image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
    env:
      KUBECONFIG: ${{ github.workspace }}/kubeconfig
      KUBECONFIG_B64: ${{ secrets.KUBECONFIG_SHOP_B64 }}
      GHCR_PAT: ${{ secrets.GHCR_PAT }}
      NS: ${{ vars.SHOP_NAMESPACE || 'luis-shop' }}
      HOST: ${{ vars.SHOP_HOST || 'shop.91.107.206.11.sslip.io' }}
      TF_VAR_kubeconfig: ${{ github.workspace }}/kubeconfig
      TF_VAR_namespace: ${{ vars.SHOP_NAMESPACE || 'luis-shop' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede
      - uses: opentofu/setup-opentofu@9d84900f3238fab8cd84ce47d658d25dd008be2f
        with:
          tofu_version: 1.13.10
      - name: Decode kubeconfig
        run: |
          printf '%s' "$KUBECONFIG_B64" | base64 --decode > "$KUBECONFIG"
          chmod 600 "$KUBECONFIG"
      - name: Ensure GHCR pull secret
        env:
          GHCR_USERNAME: ${{ github.repository_owner }}
        run: |
          test -n "$GHCR_PAT" || { echo "GHCR_PAT secret is required"; exit 1; }
          CONFIG_FILE="$(mktemp)"
          trap 'rm -f "$CONFIG_FILE"' EXIT
          AUTH="$(printf '%s:%s' "$GHCR_USERNAME" "$GHCR_PAT" | base64 -w0)"
          printf '{"auths":{"ghcr.io":{"username":"%s","password":"%s","auth":"%s"}}}' \
            "$GHCR_USERNAME" "$GHCR_PAT" "$AUTH" > "$CONFIG_FILE"
          kubectl --kubeconfig="$KUBECONFIG" create secret docker-registry ghcr-pull \
            --namespace="$NS" \
            --from-file=.dockerconfigjson="$CONFIG_FILE" \
            --dry-run=client -o yaml | kubectl --kubeconfig="$KUBECONFIG" apply -f -
      - name: Apply manifests
        run: |
          sed -i "s|IMAGE_TAG|sha-${GITHUB_SHA}|g" deploy/overlays/sandbox/patches.yaml deploy/overlays/sandbox/migrate-job.yaml
          kubectl --kubeconfig="$KUBECONFIG" apply -k deploy/overlays/sandbox
      - name: Run migration
        run: |
          kubectl --kubeconfig="$KUBECONFIG" -n "$NS" delete job -l app=catalog-migrate --ignore-not-found=true
          kubectl --kubeconfig="$KUBECONFIG" create -f deploy/overlays/sandbox/migrate-job.yaml
          kubectl --kubeconfig="$KUBECONFIG" -n "$NS" wait --for=condition=complete -l app=catalog-migrate job --timeout=300s
      - name: Pull OpenTofu state
        run: |
          kubectl --kubeconfig="$KUBECONFIG" -n "$NS" get configmap tofu-state -o jsonpath='{.data.tfstate}' > infra/terraform.tfstate 2>/dev/null || rm -f infra/terraform.tfstate
          [ -s infra/terraform.tfstate ] || rm -f infra/terraform.tfstate
      - name: Apply platform resources
        working-directory: infra
        run: |
          tofu init -backend=false -input=false
          tofu plan -input=false -out=tfplan
          tofu apply -input=false -auto-approve tfplan
      - name: Push OpenTofu state
        run: |
          kubectl --kubeconfig="$KUBECONFIG" -n "$NS" create configmap tofu-state \
            --from-file=tfstate=infra/terraform.tfstate \
            --dry-run=client -o yaml | kubectl --kubeconfig="$KUBECONFIG" apply -f -
      - name: Verify rollouts
        run: |
          for s in storefront catalog cart checkout payments-mock; do
            kubectl --kubeconfig="$KUBECONFIG" -n "$NS" rollout status deploy/$s --timeout=180s
          done
          kubectl --kubeconfig="$KUBECONFIG" -n "$NS" get pods -o wide
      - name: Smoke test
        run: curl -fsS -o /dev/null -w '%{http_code} %{time_total}\n' "http://${HOST}/"
