apiVersion: batch/v1
kind: Job
metadata:
  generateName: catalog-migrate-
  labels:
    app: catalog-migrate
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app: catalog-migrate
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: ghcr.io/luisfvanegas/mercadito-shop/catalog:IMAGE_TAG
          args: ["migrate"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: shop-postgres
                  key: url
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
