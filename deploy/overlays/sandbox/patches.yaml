apiVersion: v1
kind: ConfigMap
metadata:
  name: shop-config
data:
  CART_STORE: redis
  THUMB_CACHE_MAX_MB: "128"
  SHUTDOWN_DRAIN_SECONDS: "10"
  DB_MAX_CONNS: "5"
  PAYMENT_RETRIES: "2"
  PAYMENT_BACKOFF_MS: "200"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: storefront
spec:
  replicas: 2
  minReadySeconds: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    spec:
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: storefront
      containers:
        - name: storefront
          image: ghcr.io/luisfvanegas/mercadito-shop/storefront:IMAGE_TAG
          env:
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: shop-redis
                  key: url
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 10
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: [sh, -c, sleep 5]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
